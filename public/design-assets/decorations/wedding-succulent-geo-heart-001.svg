<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <g fill="none">
    <!-- Corazón Geométrico Recto -->
    <polygon points="300,200 150,50 50,150 300,450 550,150 450,50" stroke="var(--es-color-line, #D4AF37)" stroke-width="3" />
    <polygon points="300,220 170,80 80,160 300,420 520,160 430,80" stroke="var(--es-color-line, #D4AF37)" stroke-width="1" />
    
    <!-- Suculenta Pastel Izquierda -->
    <g transform="translate(60, 250)" stroke="none">
      <path d="M50,50 Q20,10 50,0 Q80,10 50,50 Z" fill="var(--es-color-secondary, #778899)" opacity="0.8"/>
      <path d="M50,50 Q10,20 0,50 Q10,80 50,50 Z" fill="var(--es-color-secondary, #B0C4DE)" opacity="0.9"/>
      <path d="M50,50 Q80,90 50,100 Q20,90 50,50 Z" fill="var(--es-color-secondary, #778899)" opacity="0.8"/>
      <path d="M50,50 Q90,80 100,50 Q90,20 50,50 Z" fill="var(--es-color-secondary, #B0C4DE)" opacity="0.9"/>
      <circle cx="50" cy="50" r="15" fill="var(--es-color-primary, #FFB6C1)" opacity="0.7"/>
    </g>

    <!-- Suculenta Pastel Derecha Superior -->
    <g transform="translate(420, 80) scale(0.9)" stroke="none">
      <path d="M50,50 Q20,10 50,0 Q80,10 50,50 Z" fill="var(--es-color-secondary, #778899)" opacity="0.8"/>
      <path d="M50,50 Q10,20 0,50 Q10,80 50,50 Z" fill="var(--es-color-secondary, #B0C4DE)" opacity="0.9"/>
      <path d="M50,50 Q80,90 50,100 Q20,90 50,50 Z" fill="var(--es-color-secondary, #778899)" opacity="0.8"/>
      <path d="M50,50 Q90,80 100,50 Q90,20 50,50 Z" fill="var(--es-color-secondary, #B0C4DE)" opacity="0.9"/>
      <circle cx="50" cy="50" r="15" fill="var(--es-color-primary, #FFB6C1)" opacity="0.7"/>
    </g>
  </g>
</svg>
