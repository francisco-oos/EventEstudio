<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <g fill="none">
    <!-- Doble Aro Dorado -->
    <circle cx="250" cy="250" r="200" stroke="var(--es-color-line, #C5B358)" stroke-width="3" />
    <circle cx="250" cy="250" r="185" stroke="var(--es-color-line, #C5B358)" stroke-width="1" />
    
    <!-- Follaje y Bayas Izquierda -->
    <path d="M60,200 Q40,250 80,300" stroke="var(--es-color-secondary, #8B4513)" stroke-width="2" fill="none"/>
    <circle cx="50" cy="220" r="4" fill="var(--es-color-secondary, #D2691E)" />
    <circle cx="40" cy="240" r="5" fill="var(--es-color-secondary, #D2691E)" />
    <circle cx="60" cy="280" r="4" fill="var(--es-color-secondary, #D2691E)" />
    
    <!-- Anémona Borgoña Superior Izquierda -->
    <g transform="translate(60, 120)" stroke="none">
      <circle cx="40" cy="40" r="30" fill="var(--es-color-primary, #800020)" opacity="0.9"/>
      <circle cx="40" cy="40" r="20" fill="var(--es-color-primary, #600018)"/>
      <circle cx="40" cy="40" r="8" fill="var(--es-color-line, #1A1A1A)"/>
    </g>

    <!-- Anémona Borgoña Inferior Derecha -->
    <g transform="translate(320, 320)" stroke="none">
      <circle cx="50" cy="50" r="35" fill="var(--es-color-primary, #800020)" opacity="0.9"/>
      <circle cx="50" cy="50" r="25" fill="var(--es-color-primary, #600018)"/>
      <circle cx="50" cy="50" r="10" fill="var(--es-color-line, #1A1A1A)"/>
      <path d="M90,50 Q110,30 130,60" stroke="var(--es-color-secondary, #8B4513)" stroke-width="2" fill="none"/>
      <circle cx="110" cy="40" r="5" fill="var(--es-color-secondary, #D2691E)" />
    </g>
  </g>
</svg>
