<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Líneas base -->
    <line x1="50" y1="50" x2="400" y2="50" stroke="var(--es-color-primary, #C5A059)" stroke-width="2" />
    <line x1="600" y1="50" x2="950" y2="50" stroke="var(--es-color-primary, #C5A059)" stroke-width="2" />
    <line x1="100" y1="40" x2="380" y2="40" stroke="var(--es-color-primary, #C5A059)" stroke-width="1" opacity="0.5" />
    <line x1="620" y1="40" x2="900" y2="40" stroke="var(--es-color-primary, #C5A059)" stroke-width="1" opacity="0.5" />
    <line x1="100" y1="60" x2="380" y2="60" stroke="var(--es-color-primary, #C5A059)" stroke-width="1" opacity="0.5" />
    <line x1="620" y1="60" x2="900" y2="60" stroke="var(--es-color-primary, #C5A059)" stroke-width="1" opacity="0.5" />
    
    <!-- Centro Geométrico Art Déco -->
    <polygon points="500,10 540,50 500,90 460,50" fill="var(--es-color-accent, #1A1A1A)" stroke="var(--es-color-primary, #C5A059)" stroke-width="3" />
    <polygon points="500,25 525,50 500,75 475,50" stroke="var(--es-color-primary, #C5A059)" stroke-width="1.5" />
    
    <!-- Arcos escalonados izquierda -->
    <path d="M400,50 L420,30 L460,30" stroke="var(--es-color-primary, #C5A059)" stroke-width="2" />
    <path d="M400,50 L420,70 L460,70" stroke="var(--es-color-primary, #C5A059)" stroke-width="2" />
    <path d="M380,50 L410,20 L460,20" stroke="var(--es-color-primary, #C5A059)" stroke-width="1" />
    <path d="M380,50 L410,80 L460,80" stroke="var(--es-color-primary, #C5A059)" stroke-width="1" />
    
    <!-- Arcos escalonados derecha -->
    <path d="M600,50 L580,30 L540,30" stroke="var(--es-color-primary, #C5A059)" stroke-width="2" />
    <path d="M600,50 L580,70 L540,70" stroke="var(--es-color-primary, #C5A059)" stroke-width="2" />
    <path d="M620,50 L590,20 L540,20" stroke="var(--es-color-primary, #C5A059)" stroke-width="1" />
    <path d="M620,50 L590,80 L540,80" stroke="var(--es-color-primary, #C5A059)" stroke-width="1" />
  </g>
</svg>
