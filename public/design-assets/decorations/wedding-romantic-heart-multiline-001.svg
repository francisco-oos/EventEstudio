<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <g fill="none" stroke="var(--es-color-line, #D4AF37)" stroke-linecap="round">
    <!-- Corazón Multi-línea -->
    <path d="M250,150 C250,150 200,50 100,100 C0,150 100,300 250,450 C400,300 500,150 400,100 C300,50 250,150 250,150 Z" stroke-width="3"/>
    <path d="M250,170 C250,170 210,80 120,120 C30,160 120,290 250,420 C380,290 470,160 380,120 C290,80 250,170 250,170 Z" stroke-width="1.5"/>
    <path d="M250,190 C250,190 220,110 140,140 C60,170 140,280 250,390 C360,280 440,170 360,140 C280,110 250,190 250,190 Z" stroke-width="1"/>
    
    <!-- Magnolia Izquierda -->
    <g transform="translate(60, 220)" stroke="none">
      <path d="M30,30 C10,10 5,40 20,50 C40,60 50,10 30,30 Z" fill="var(--es-color-accent, #2E8B57)"/>
      <circle cx="40" cy="40" r="25" fill="var(--es-color-primary, #FFFFFF)" opacity="0.9"/>
      <path d="M40,15 Q50,40 65,40 Q50,50 40,65 Q30,50 15,40 Q30,40 40,15 Z" fill="var(--es-color-primary, #FFF8DC)"/>
      <circle cx="40" cy="40" r="5" fill="var(--es-color-line, #D4AF37)"/>
    </g>

    <!-- Magnolia Derecha Superior -->
    <g transform="translate(380, 120) scale(0.8)" stroke="none">
      <path d="M30,30 C10,10 5,40 20,50 C40,60 50,10 30,30 Z" fill="var(--es-color-accent, #2E8B57)"/>
      <circle cx="40" cy="40" r="25" fill="var(--es-color-primary, #FFFFFF)" opacity="0.9"/>
      <path d="M40,15 Q50,40 65,40 Q50,50 40,65 Q30,50 15,40 Q30,40 40,15 Z" fill="var(--es-color-primary, #FFF8DC)"/>
      <circle cx="40" cy="40" r="5" fill="var(--es-color-line, #D4AF37)"/>
    </g>
  </g>
</svg>
