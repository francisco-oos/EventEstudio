<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Capa Bauhaus Minimalista -->
  <g fill="none">
    <!-- Círculo principal sólido -->
    <circle cx="200" cy="100" r="80" fill="var(--es-color-secondary, #E0E0E0)" opacity="0.3" />
    
    <!-- Círculo delineado descentrado -->
    <circle cx="240" cy="80" r="80" stroke="var(--es-color-line, #4A90E2)" stroke-width="2" />
    
    <!-- Bloque geométrico sólido -->
    <rect x="350" y="50" width="150" height="100" fill="var(--es-color-primary, #FFFFFF)" opacity="0.9" />
    <rect x="370" y="70" width="150" height="100" fill="var(--es-color-secondary, #E0E0E0)" opacity="0.5" />
    
    <!-- Líneas de composición fina -->
    <line x1="50" y1="100" x2="750" y2="100" stroke="var(--es-color-line, #4A90E2)" stroke-width="1" />
    <line x1="600" y1="20" x2="600" y2="180" stroke="var(--es-color-line, #4A90E2)" stroke-width="1" />
    
    <!-- Puntos focales (dots) -->
    <circle cx="600" cy="100" r="6" fill="var(--es-color-line, #4A90E2)" />
    <circle cx="650" cy="100" r="4" fill="var(--es-color-line, #4A90E2)" />
    <circle cx="700" cy="100" r="2" fill="var(--es-color-line, #4A90E2)" />
  </g>
</svg>
