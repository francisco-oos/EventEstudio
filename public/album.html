<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Álbum del evento</title>
  <link rel="stylesheet" href="/styles.css?v=6.14.2-rc.30">
</head>
<body class="simple-page album-page">
  <header id="albumHero" class="album-hero">
    <div><p class="eyebrow">Álbum colaborativo</p><h1 id="albumEventName">Nuestro evento</h1><p id="albumDate"></p></div>
  </header>
  <main class="section upload-card centered album-upload-card">
    <p class="eyebrow">Álbum colaborativo</p>
    <h1 class="page-title">Comparte tus fotos</h1>
    <p id="albumWelcome">Ayúdanos a conservar este día desde tu mirada.</p>
    <p id="tableLabel" class="table-badge"></p>
    <p class="muted">Puedes seleccionar hasta 20 fotografías por envío. Guardamos los archivos originales para conservar su calidad.</p>

    <form id="photoForm" class="form-grid">
      <label class="wide">
        Tu nombre
        <input id="uploadedBy" name="uploadedBy" maxlength="120" placeholder="Opcional">
      </label>
      <label class="wide">
        Mensaje para los anfitriones
        <textarea id="photoMessage" name="message" maxlength="500" rows="4" placeholder="Opcional: comparte un deseo o el recuerdo detrás de estas fotos"></textarea>
        <small>Se publicará en el álbum sólo si los anfitriones lo aprueban.</small>
      </label>
      <label class="wide dropzone">
        Seleccionar fotografías
        <input id="photos" name="photos" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple required>
        <span>Elige hasta 20 imágenes desde tu cámara o galería.</span>
      </label>
      <div id="selectedPhotoPreview" class="selected-photo-preview wide" aria-live="polite"></div>
      <button id="photoSubmit" class="primary-btn wide" type="submit">Subir fotografías</button>
    </form>

    <progress id="photoProgress" class="wide" max="100" value="0" hidden></progress>
    <p id="photoStatus" class="status-message"></p>
    <button id="uploadMorePhotos" class="secondary-btn hidden" type="button">Agregar otras fotografías</button>
  </main>
  <script src="/album.js?v=6.14.2-rc.30"></script>
</body>
</html>
