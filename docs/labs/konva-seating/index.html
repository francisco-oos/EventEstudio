<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventStudio · Konva Seating Lab</title>
<style>html,body{margin:0;height:100%;font-family:system-ui;background:#f4f1ec;color:#202733}.bar{display:flex;gap:.5rem;align-items:center;padding:.7rem;background:#fff;border-bottom:1px solid #ddd;position:relative;z-index:2}.bar button{padding:.55rem .8rem;border:1px solid #a52b45;border-radius:999px;background:#fff;color:#842039}.bar button.primary{background:#842039;color:#fff}.note{margin-left:auto;font-size:.75rem;color:#666}#stage{height:calc(100vh - 58px);touch-action:none}</style></head>
<body><div class="bar"><button id="addRound" class="primary">+ Mesa redonda</button><button id="addRect">+ Mesa rectangular</button><button id="reset">Restablecer</button><span class="note">LAB aislado · no forma parte del runtime RC15</span></div><div id="stage"></div>
<script type="module">
import Konva from 'https://cdn.jsdelivr.net/npm/konva@10.3.0/+esm';
const host=document.getElementById('stage');
const stage=new Konva.Stage({container:'stage',width:host.clientWidth,height:host.clientHeight,draggable:true});
const grid=new Konva.Layer(),objects=new Konva.Layer();stage.add(grid);stage.add(objects);
function drawGrid(){grid.destroyChildren();for(let x=0;x<stage.width();x+=40)grid.add(new Konva.Line({points:[x,0,x,stage.height()],stroke:'#ddd7ce',strokeWidth:1}));for(let y=0;y<stage.height();y+=40)grid.add(new Konva.Line({points:[0,y,stage.width(),y],stroke:'#ddd7ce',strokeWidth:1}));grid.draw();}
function snap(n){const g=20;return Math.round(n/g)*g}
function addTable(kind='round',x=stage.width()/2,y=stage.height()/2){const group=new Konva.Group({x,y,draggable:true,name:'table'});const shape=kind==='round'?new Konva.Circle({radius:58,fill:'#fff',stroke:'#842039',strokeWidth:3,shadowBlur:8,shadowOpacity:.15}):new Konva.Rect({x:-76,y:-48,width:152,height:96,cornerRadius:18,fill:'#fff',stroke:'#842039',strokeWidth:3,shadowBlur:8,shadowOpacity:.15});const label=new Konva.Text({x:-55,y:-9,width:110,align:'center',text:`Mesa ${objects.find('.table').length+1}`,fontSize:16,fontStyle:'bold',fill:'#202733'});group.add(shape,label);group.on('dragend',()=>group.position({x:snap(group.x()),y:snap(group.y())}));objects.add(group);objects.draw();}
document.getElementById('addRound').onclick=()=>addTable('round');document.getElementById('addRect').onclick=()=>addTable('rect');document.getElementById('reset').onclick=()=>{objects.destroyChildren();objects.draw();addTable('round')};
let lastDist=0,lastCenter=null;const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),center=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});stage.on('touchmove',e=>{const [a,b]=e.evt.touches;if(!a||!b)return;e.evt.preventDefault();const rect=stage.container().getBoundingClientRect(),p1={x:a.clientX-rect.left,y:a.clientY-rect.top},p2={x:b.clientX-rect.left,y:b.clientY-rect.top},c=center(p1,p2),d=distance(p1,p2);if(!lastDist){lastDist=d;lastCenter=c;return;}const old=stage.scaleX(),next=Math.max(.45,Math.min(2.4,old*d/lastDist)),point={x:(c.x-stage.x())/old,y:(c.y-stage.y())/old};stage.scale({x:next,y:next});stage.position({x:c.x-point.x*next,y:c.y-point.y*next});lastDist=d;lastCenter=c;});stage.on('touchend',()=>{lastDist=0;lastCenter=null});
new ResizeObserver(()=>{stage.size({width:host.clientWidth,height:host.clientHeight});drawGrid()}).observe(host);drawGrid();addTable('round');
</script></body></html>
